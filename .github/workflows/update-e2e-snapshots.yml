name: Update E2E snapshots

# Régénère le jeu « CI » des références visuelles de packages/ui (dossiers `<projet>-ci`),
# rendu avec le Chromium de Playwright installé ici. Déclenchement MANUEL uniquement :
#   Actions > « Update E2E snapshots » > Run workflow, en choisissant la branche de la PR.
# Le jeu « session » (Chromium préinstallé) n'est jamais touché. Le seuil maxDiffPixelRatio n'est pas relâché.
on:
  workflow_dispatch:

# Seul workflow du dépôt avec l'écriture : nécessaire pour pousser le commit de références.
permissions:
  contents: write

concurrency:
  group: update-e2e-snapshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Générer les références E2E (CI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      # Garde explicite : jamais de poussée sur les branches protégées.
      - name: Refuser main et dev
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "dev" ]; then
            echo "::error::Refus de générer/pousser sur '$REF_NAME'. Lancer le workflow sur la branche de la PR."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true # nécessaire au `git push` final

      - uses: ./.github/actions/setup-pnpm

      - name: Version de Playwright
        id: pw
        run: echo "version=$(pnpm --filter @cp/ui exec playwright --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Cache du navigateur Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # --with-deps (apt) à chaque fois : le cache ne couvre pas les bibliothèques système.
      - name: Installer Chromium (Playwright)
        run: pnpm --filter @cp/ui exec playwright install --with-deps chromium

      - name: Générer les références (--update-snapshots)
        run: >-
          pnpm --filter @cp/ui exec playwright test
          --config tests/e2e/playwright.config.ts
          --project=desktop-light --project=mobile-light
          --update-snapshots

      # Preuve de déterminisme : un second rendu, comparé aux références fraîches, au seuil habituel.
      - name: Vérifier sans --update-snapshots (déterminisme)
        run: >-
          pnpm --filter @cp/ui exec playwright test
          --config tests/e2e/playwright.config.ts
          --project=desktop-light --project=mobile-light

      - name: Commit et push des références
        env:
          REF_NAME: ${{ github.ref_name }}
          PW_VERSION: ${{ steps.pw.outputs.version }}
        run: |
          if [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "dev" ]; then
            echo "::error::Refus de pousser sur '$REF_NAME'."
            exit 1
          fi
          git add packages/ui/tests/e2e/__screens__
          {
            echo "### Références E2E (jeu CI) — Chromium de Playwright ${PW_VERSION}"
            echo
            echo "Branche : \`${REF_NAME}\`"
            echo
            if git diff --cached --quiet; then
              echo "Aucune référence modifiée : le jeu CI est déjà à jour (rien n'est poussé)."
            else
              echo '```'
              git diff --cached --name-status -- packages/ui/tests/e2e/__screens__
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if git diff --cached --quiet; then
            echo "Rien à commiter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ui): références E2E générées en CI (Chromium de Playwright ${PW_VERSION})"
          git push origin "HEAD:refs/heads/${REF_NAME}"
          {
            echo
            echo "Commit poussé. Un push par GITHUB_TOKEN ne déclenche pas la CI de la PR :"
            echo "relancer la CI (commit vide poussé par un humain, ou « Re-run all jobs »/close-reopen de la PR)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefacts d'échec (rapport, traces, diffs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-e2e-snapshots-${{ github.run_id }}
          path: |
            packages/ui/tests/e2e/playwright-report/
            packages/ui/tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
