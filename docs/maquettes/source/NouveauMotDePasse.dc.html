<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Nouveau mot de passe</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="ds/project-cp/components/bundle.css">
<link rel="stylesheet" href="styles/auth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a-root" data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; padding: 24px 20px 28px; gap: 24px;">
<div class="a-brand">
<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect width="32" height="32" rx="9" style="fill: var(--brand-violet)"></rect><path d="M16 17 L8 10 M16 17 L25 9 M16 17 L23 25" style="stroke: #fff; stroke-width: 1.75; stroke-linecap: round"></path><circle cx="8" cy="10" r="2.5" style="fill: #fff"></circle><circle cx="25" cy="9" r="2.5" style="fill: #fff"></circle><circle cx="23" cy="25" r="2.5" style="fill: #fff"></circle><circle cx="16" cy="17" r="4" style="fill: #fff"></circle></svg>
<span>project-cp</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 32px;">
<h1 class="a-h1-sm">Choisissez un nouveau mot de passe</h1>
<p class="a-lead">Pour le compte <span style="color: var(--ink); font-weight: 500;">awa@boutique-exemple.cm</span></p>
</div>
<form style="display: flex; flex-direction: column; gap: 20px; flex-grow: 1;">
<div class="cp-field a-lg" style="max-width: none;">
<label class="cp-label" for="pw">Nouveau mot de passe</label>
<div class="a-pw">
<input class="cp-input" id="pw" type="password" autocomplete="new-password" value="unmotdepasse">
<button class="a-eye" type="button" aria-label="Afficher le mot de passe"><svg class="cp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
<div class="a-strength" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i><i></i></div>
<span class="cp-help">Moyen. Ajoutez quelques caractères pour atteindre 12.</span>
</div>
<div class="cp-field a-lg" style="max-width: none;">
<label class="cp-label" for="pw2">Confirmez le mot de passe</label>
<div class="a-pw">
<input class="cp-input" id="pw2" type="password" autocomplete="new-password" value="">
<button class="a-eye" type="button" aria-label="Afficher le mot de passe"><svg class="cp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>
<label class="a-check"><input type="checkbox" checked>Déconnecter mes autres appareils</label>
<div style="flex-grow: 1;"></div>
<button class="cp-btn cp-btn-lg a-full" type="submit" disabled style="justify-content: center;">Enregistrer</button>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'light' };
}
}
</script>
</body>
</html>
