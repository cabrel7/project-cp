<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Code SMS</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="ds/project-cp/components/bundle.css">
<link rel="stylesheet" href="styles/auth.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a-root" data-theme="{{theme}}" style="width: 390px; height: 844px; display: flex; flex-direction: column; padding: 16px 20px 28px; gap: 24px;">
<a class="cp-btn cp-btn-ghost" href="#" style="align-self: flex-start; height: 44px; margin-left: -12px; text-decoration: none;"><svg class="cp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>Retour</a>
<div class="a-icon-soft" style="margin-top: 16px;"><svg class="cp-icon" viewBox="0 0 24 24" aria-hidden="true"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect><path d="M12 18h.01"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 class="a-h1-sm">Entrez le code reçu par SMS</h1>
<p class="a-lead">Envoyé au <span class="cp-num" style="color: var(--ink); font-weight: 500;">+237 6 90 •• •• 42</span>. <a class="a-link" href="#">Modifier</a></p>
</div>
<form style="display: flex; flex-direction: column; gap: 20px; flex-grow: 1;">
<fieldset style="border: 0; margin: 0; padding: 0;">
<legend class="cp-label" style="margin-bottom: 8px;">Code à 6 chiffres</legend>
<div class="a-otp" style="justify-content: space-between;">
<input inputmode="numeric" autocomplete="one-time-code" maxlength="1" value="2" aria-label="Chiffre 1">
<input inputmode="numeric" maxlength="1" value="7" aria-label="Chiffre 2">
<input inputmode="numeric" maxlength="1" value="0" aria-label="Chiffre 3">
<input inputmode="numeric" maxlength="1" value="5" aria-label="Chiffre 4">
<input class="a-otp-on" inputmode="numeric" maxlength="1" value="" aria-label="Chiffre 5">
<input inputmode="numeric" maxlength="1" value="" aria-label="Chiffre 6">
</div>
</fieldset>
<p class="cp-help" style="margin: 0;">Vous n'avez rien reçu ? <span class="cp-num" style="color: var(--ink);">Nouvel envoi possible dans 0:42</span></p>
<div class="cp-alert cp-alert-tip">
<svg class="cp-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
<p class="cp-alert-body" style="margin: 0;">Le code est valable 10 minutes. Ne le communiquez à personne, même à notre équipe.</p>
</div>
<div style="flex-grow: 1;"></div>
<button class="cp-btn cp-btn-primary cp-btn-lg a-full" type="submit" style="justify-content: center;">Vérifier</button>
</form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'light' };
}
}
</script>
</body>
</html>
