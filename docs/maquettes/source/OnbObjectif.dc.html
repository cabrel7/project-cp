<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Onboarding — objectif (profil activité)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="ds/project-cp/components/bundle.css">
<link rel="stylesheet" href="styles/auth.css">
<link rel="stylesheet" href="styles/onboarding.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="a-root o-main" data-theme="{{theme}}" style="width: 1280px; height: 860px;">
<header class="o-top">
<div class="a-brand">
<svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><rect width="32" height="32" rx="9" style="fill: var(--brand-violet)"></rect><path d="M16 17 L8 10 M16 17 L25 9 M16 17 L23 25" style="stroke: #fff; stroke-width: 1.75; stroke-linecap: round"></path><circle cx="8" cy="10" r="2.5" style="fill: #fff"></circle><circle cx="25" cy="9" r="2.5" style="fill: #fff"></circle><circle cx="23" cy="25" r="2.5" style="fill: #fff"></circle><circle cx="16" cy="17" r="4" style="fill: #fff"></circle></svg>
<span>project-cp</span>
</div>
<ol class="cp-stepper" aria-label="Progression">
<li class="cp-step cp-step-done"><span class="cp-step-n"><svg class="cp-icon cp-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>Profil</li>
<li class="cp-step-sep" aria-hidden="true"></li>
<li class="cp-step cp-step-current" aria-current="step"><span class="cp-step-n">2</span>Objectif</li>
<li class="cp-step-sep" aria-hidden="true"></li>
<li class="cp-step"><span class="cp-step-n">3</span>Premier pas</li>
</ol>
<a class="cp-btn cp-btn-ghost" href="#" style="text-decoration: none;">Passer pour l'instant</a>
</header>
<div class="o-body">
<div class="o-wrap">
<div class="o-head">
<h1 class="a-h1">Que voulez-vous que l'IA fasse pour vous ?</h1>
<p class="a-lead">Choisissez une première chose. Vous pourrez en ajouter d'autres à tout moment.</p>
</div>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px;">
<legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Objectif</legend>
<label class="o-row is-on">
<span class="o-ico"><svg class="cp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg></span>
<span><b>Répondre à mes questions sur mon activité</b><q>Combien ai-je vendu cette semaine ?</q></span>
<input type="radio" name="obj" checked>
</label>
<label class="o-row">
<span class="o-ico o-ico-accent"><svg class="cp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg></span>
<span><b>Faire une tâche à ma place, régulièrement</b><q>Chaque lundi, envoie-moi le point sur les stocks.</q></span>
<input type="radio" name="obj">
</label>
<label class="o-row">
<span class="o-ico"><svg class="cp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22v-5"></path><path d="M9 8V2"></path><path d="M15 8V2"></path><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"></path></svg></span>
<span><b>Utiliser Claude ou ChatGPT avec mes outils</b><q>Demande à Claude de préparer ma facture à partir de la commande.</q></span>
<input type="radio" name="obj">
</label>
<label class="o-row">
<span class="o-ico o-ico-plain"><svg class="cp-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"></path></svg></span>
<span><b>Je ne sais pas encore</b><q>Montrez-moi des exemples pour mon métier.</q></span>
<input type="radio" name="obj">
</label>
</fieldset>
</div>
</div>
<div class="o-bar">
<div class="o-bar-in">
<button class="cp-btn cp-btn-lg" type="button"><svg class="cp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>Retour</button>
<button class="cp-btn cp-btn-primary cp-btn-lg" type="button">Continuer<svg class="cp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1280,"height":860}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'light' };
}
}
</script>
</body>
</html>
